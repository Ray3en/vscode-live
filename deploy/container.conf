server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    location ~ ^/rooms(?:/|$) {
        # Room URLs contain bearer capabilities.
        access_log off;
        proxy_pass http://api:7341;
    }
    location = /healthz {
        access_log off;
        proxy_pass http://api:7341;
    }
    location / { try_files $uri $uri/ =404; }
}
