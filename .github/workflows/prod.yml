name: Publish and deploy prod
on:
  push:
    branches: [prod]
  workflow_dispatch:
concurrency:
  group: vscode-live-prod
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "RELEASE=$GITHUB_SHA" >> "$GITHUB_ENV"
          docker build --target api -t "$prefix/api:$GITHUB_SHA" .
          docker build --target web -t "$prefix/web:$GITHUB_SHA" .
      - name: Test through Nginx
        env:
          HOST_KEY: ci-test-only
        run: |
          set -euo pipefail
          trap 'docker compose down' EXIT
          node --check web/app.js
          node --check extension/extension.js
          docker compose up -d --wait --wait-timeout 90
          curl -fsS http://127.0.0.1:18081/ | grep -q 'Эфир'
          node deploy/smoke.mjs http://127.0.0.1:18081
      - name: Deploy over SSH
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_deploy)
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null; then
            echo "PRIVATE_KEY is not a valid SSH private key" >&2
            exit 1
          fi
          ssh_opts=(
            -i ~/.ssh/id_deploy
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=accept-new
          )
          remote="$SSH_USER@$SSH_HOST"
          dir="${DEPLOY_DIR%/}/releases/$RELEASE"
          echo "Connecting to SSH host on port 22..."
          ssh "${ssh_opts[@]}" "$remote" "test -s '${DEPLOY_DIR%/}/.env' && mkdir -p '$dir'"
          printf 'IMAGE_PREFIX=%s\nRELEASE=%s\n' "$IMAGE_PREFIX" "$RELEASE" > release.env
          tar czf - compose.yaml release.env deploy/activate.sh | ssh "${ssh_opts[@]}" "$remote" "tar xzf - -C '$dir'"
          docker save "$IMAGE_PREFIX/api:$RELEASE" "$IMAGE_PREFIX/web:$RELEASE" | gzip -1 | ssh "${ssh_opts[@]}" "$remote" 'gzip -dc | docker load'
          ssh "${ssh_opts[@]}" "$remote" "cd '$dir' && mv -f deploy/activate.sh activate.sh && bash activate.sh"
